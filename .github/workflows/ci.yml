name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build, test, and prove the image builds on every PR. A push to main also
# deploys: the deploy job pushes the image to GHCR and pins app1 to it. Only
# that job holds `packages: write`. No dependency needs a registry credential,
# because every one is on the public npm registry.
permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, Pre-commit & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup Python (for pre-commit)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: vitest

      - name: Unit tests with coverage
        run: pnpm test:unit --run --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker-build:
    name: docker build (publicpress-website)
    runs-on: ubuntu-latest
    # Build-only, no credentials: proves the Dockerfile still builds on every
    # PR and on push.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag publicpress-website:ci .

  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    needs: [checks, e2e, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: publicpress-website-production-deploy
      cancel-in-progress: false
    # packages: write only here, on the one trigger that runs this job, so a
    # PR build never holds a publish credential.
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/branchleft/publicpress-website
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags from one build, so `latest` and the commit tag are the same
      # layers.
      - name: Build and push image
        run: |
          docker build --tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:latest" .
          docker push "$IMAGE" --all-tags

      # The host refuses anything that is not pinned by digest. The grep takes
      # the bare sha256 value whatever block `imagetools inspect` prints.
      - name: Resolve the pushed image's digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}' \
            | grep -o 'sha256:[0-9a-f]*' | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve a digest for $IMAGE:$IMAGE_TAG"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The key comes from a secret through env, never through `run:`
      # interpolation, so it never reaches a log.
      - name: Write the deploy SSH key
        env:
          SSH_KEY: ${{ secrets.HETZNER_APP1_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/app1_deploy_key

      # Pinned, not trusted on first use: a fresh runner has never seen app1.
      - name: Pin app1's host key
        env:
          HETZNER_APP1_SSH_HOST_KEY: ${{ vars.HETZNER_APP1_SSH_HOST_KEY }}
        run: |
          if [ -z "$HETZNER_APP1_SSH_HOST_KEY" ]; then
            echo "::error::HETZNER_APP1_SSH_HOST_KEY is empty or unset; set the repository variable before deploying"
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_APP1_SSH_HOST_KEY" >> ~/.ssh/known_hosts

      # The key is a deploy slot key: app1 forces the command
      # `branchleft-deploy --slot publicpress-website`, which reads one image
      # reference on stdin, pins it, restarts the stack and waits for its
      # healthcheck. A zero exit means the new container is healthy. The key
      # can run nothing else, so there is no separate smoke test over SSH; the
      # public check comes once the edge points at the app.
      - name: Pin app1 to the pushed digest and restart the stack
        env:
          HETZNER_APP1_HOST: ${{ vars.HETZNER_APP1_HOST }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          printf '%s\n' "$IMAGE@$DIGEST" \
            | ssh -i ~/.ssh/app1_deploy_key -o BatchMode=yes "deploy@$HETZNER_APP1_HOST"
